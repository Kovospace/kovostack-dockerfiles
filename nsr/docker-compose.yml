services:

  app:
    # Local build. For a registry deploy, comment `build` and set `image:`.
    image: 95.216.187.218:5000/nsr-frontend:latest
    container_name: "nsr-app"
    ports:
      - "3010:3000" # host 3010 → container 3000 (optional when behind nginx-proxy)
    user: "0:0" # run as root so the bind-mounted volumes stay writable
    environment:
      # ── App ──────────────────────────────────────────────────────────────
      DATABASE_URI: ${DATABASE_URI:-file:/app/data/nsr.db}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://neser.sk}
      # ── nginx-proxy + acme-companion (Let's Encrypt) ─────────────────────
      # Read by the shared proxy/companion containers on the nginx-proxy
      # network: they route the domain to this container and issue its TLS cert.
      VIRTUAL_HOST: ${VIRTUAL_HOST:-neser.sk}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-3000}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-neser.sk}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-kovo.mato@gmail.com}
    volumes:
      - /home/kovo/docker/volumes/nsr/sqlite/db:/app/data # SQLite database file
      - /home/kovo/docker/volumes/nsr/media:/app/public/media # uploaded flyers + DJ sets
    networks:
      - nginx-proxy
    restart: unless-stopped

networks:
  # Shared external network that nginx-proxy + acme-companion also join.
  # Create it once on the host: `docker network create nginx-proxy`
  nginx-proxy:
    external: true