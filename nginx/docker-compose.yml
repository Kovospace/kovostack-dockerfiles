version: "3"
services:
  proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - 80:80
      - 443:443
    labels:
      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost.d:/etc/nginx/vhost.d
      - ./vhost.d/default:/etc/nginx/vhost.d/default:ro
      - html:/usr/share/nginx/html
      - ${DOCKER_HOST_PATH:-/var/run/docker.sock}:/tmp/docker.sock:ro
    networks:
      - nginx-proxy
      - default
 
  letsencrypt-companion:
    image: nginxproxy/acme-companion
    container_name: letsencrypt
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - certs:/etc/nginx/certs
      - acme:/etc/acme.sh
      - vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - ${DOCKER_HOST_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - nginx-proxy
    depends_on:
      - proxy
 
networks:
  nginx-proxy:
    external: true
 
volumes:
  certs:
  acme:
  vhost.d:
  html: