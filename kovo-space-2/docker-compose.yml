services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kovospace:${POSTGRES_PASSWORD}@postgres:5434/kovospace
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    volumes:
      - /home/kovo/docker/volumes/kovo-space-2/media_uploads:/app/public/media
      - /home/kovo/docker/volumes/kovo-space-2/icon_uploads:/app/public/icons
      - /home/kovo/docker/volumes/kovo-space-2/image_uploads:/app/public/images
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: kovospace
      POSTGRES_USER: kovospace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /home/kovo/docker/volumes/kovo-space-2/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovospace"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped